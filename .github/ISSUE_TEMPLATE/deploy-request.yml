name: Solicitud de despliegue
description: Solicita desplegar un módulo de Terraform
title: "[deploy] "
labels: ["deployment-request"]

body:
  - type: dropdown
    id: cloud
    attributes:
      label: Nube
      options:
        - aws
        - azure
        - gcp
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Módulo
      options:
        - network
        - aks
        - storage
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Componente de red
      options:
          - virtual-network
          - subnet
    validations:
      required: true
