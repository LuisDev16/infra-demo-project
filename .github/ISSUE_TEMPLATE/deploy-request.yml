name: Infrastructure request
description: Request Azure infrastructure through the platform assistant
title: "[infra] "
labels: ["infrastructure-request"]

body:
  - type: markdown
    attributes:
      value: |
        Describe what you need in plain language. The assistant will ask for missing required module values.
        This intake currently deploys Azure only. Do not include credentials, secrets, customer data, or other sensitive information.

  - type: dropdown
    id: cloud
    attributes:
      label: Cloud
      options:
        - azure
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: Infrastructure request
      description: Example: Create an Azure VNet named vnet-dev-01 and subnet subnet-dev-01.
      placeholder: I need an Azure network for ...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment (optional)
      placeholder: dev

  - type: input
    id: location
    attributes:
      label: Azure location (optional)
      placeholder: eastus

