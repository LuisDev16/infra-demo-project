name: Infrastructure request
description: Request AWS or Azure network infrastructure through the platform assistant
title: "[infra] "
labels: ["infrastructure-request"]

body:
  - type: markdown
    attributes:
      value: |
        Describe what you need in plain language. The assistant will ask for missing required module values.
        AWS requests currently use the region configured on the HCP workspace and the AWS network module creates a VPC and subnet only.
        Do not include credentials, secrets, customer data, or other sensitive information.

  - type: dropdown
    id: cloud
    attributes:
      label: Cloud
      options:
        - aws
        - azure
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: Infrastructure request
      description: Example: Create an AWS VPC named vpc-dev-01 with CIDR 10.20.0.0/16 and a subnet using 10.20.1.0/24.
      placeholder: I need an AWS or Azure network for ...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment (optional)
      placeholder: dev

  - type: input
    id: location
    attributes:
      label: Azure location or AWS region (optional)
      description: AWS must match the region configured in the HCP workspace.
      placeholder: eastus or us-east-1

