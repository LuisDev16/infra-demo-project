name: Infrastructure Copilot and Terraform

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "environments/azure/**"
      - ".github/workflows/issue-copilot.yml"
  push:
    branches: [main]
    paths:
      - "environments/azure/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  copilot:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'infrastructure-request')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.comment.user.type != 'Bot' && contains(github.event.issue.labels.*.name, 'infrastructure-request'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Terraform for generated configuration formatting
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Conversational infrastructure intake
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PLATFORM_TOKEN: ${{ secrets.GH_PLATFORM_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          MODULE_REPO: LuisDev16/modulos-terraform
        run: python src/copilot.py

  validate:
    name: Terraform format and validate
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize and validate Azure configuration
        run: |
          set -euo pipefail
          directory="environments/azure"
          terraform -chdir="$directory" init -backend=false -input=false
          terraform -chdir="$directory" validate -no-color

  plan:
    name: Plan Azure deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_PLAN_ENCRYPTION_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
      OPERATION: apply
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Azure OIDC environment
        shell: bash
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          {
            echo "ARM_USE_OIDC=true"
            echo "ARM_CLIENT_ID=$CLIENT_ID"
            echo "ARM_TENANT_ID=$TENANT_ID"
            echo "ARM_SUBSCRIPTION_ID=$SUBSCRIPTION_ID"
          } >> "$GITHUB_ENV"

      - name: Initialize backend and create saved plan
        shell: bash
        run: |
          set -euo pipefail
          directory="environments/azure"
          plan_file="$RUNNER_TEMP/tfplan"
          plan_output_file="$RUNNER_TEMP/terraform-plan-output.txt"
          terraform -chdir="$directory" init -input=false

          backend_file="$directory/.terraform/terraform.tfstate"
          backend_type="local"
          if [[ -f "$backend_file" ]]; then
            backend_type="$(jq -r '.backend.type // "local"' "$backend_file")"
          fi
          if [[ "$backend_type" == "local" ]]; then
            echo "::error::No remote Terraform backend is configured for Azure. Configure Azure Blob Storage with state locking."
            exit 1
          fi

          var_file=()
          if [[ -f "$directory/terraform.tfvars" ]]; then
            var_file=(-var-file=terraform.tfvars)
          fi

          terraform -chdir="$directory" plan -input=false -lock-timeout=5m -out="$plan_file" "${var_file[@]}" > "$plan_output_file"

          {
            echo "## Terraform plan review — Azure"
            echo "- Operation: $OPERATION"
            echo "- Commit: $GITHUB_SHA"
            echo ""
            echo "| Action | Resource address |"
            echo "| --- | --- |"
            terraform -chdir="$directory" show -json "$plan_file" | jq -r '
              [.resource_changes[]? | select(.mode == "managed") |
                "| \(.change.actions | join(",")) | `\(.address)` |"] |
              if length == 0 then "| no-op | No managed-resource changes |" else .[] end
            '
            echo ""
            echo "The exact saved plan is encrypted and retained for one day. Review this summary before approving the protected deployment environment."
            echo ""
            echo "### Terraform plan (sensitive values are redacted by Terraform)"
            echo '```terraform'
            terraform -chdir="$directory" show -no-color "$plan_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -z "$TF_PLAN_ENCRYPTION_KEY" ]]; then
            echo "::error::Add the TF_PLAN_ENCRYPTION_KEY Actions secret before creating a plan."
            exit 1
          fi
          printf '%s' "$TF_PLAN_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$RUNNER_TEMP/tfplan.gpg" "$plan_file"
          rm -f "$plan_file" "$plan_output_file"

      - name: Upload encrypted plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}-azure-apply
          path: ${{ runner.temp }}/tfplan.gpg
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Apply reviewed Azure plan
    if: needs.plan.result == 'success' && github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-latest
    environment:
      name: terraform-apply
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_PLAN_ENCRYPTION_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Azure OIDC environment
        shell: bash
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          {
            echo "ARM_USE_OIDC=true"
            echo "ARM_CLIENT_ID=$CLIENT_ID"
            echo "ARM_TENANT_ID=$TENANT_ID"
            echo "ARM_SUBSCRIPTION_ID=$SUBSCRIPTION_ID"
          } >> "$GITHUB_ENV"

      - name: Download and apply the exact reviewed plan
        shell: bash
        run: |
          set -euo pipefail
          directory="environments/azure"
          plan_file="$RUNNER_TEMP/tfplan"
          encrypted_plan="$RUNNER_TEMP/encrypted-plan/tfplan.gpg"

          if [[ -z "$TF_PLAN_ENCRYPTION_KEY" ]]; then
            echo "::error::TF_PLAN_ENCRYPTION_KEY is not available to the protected environment."
            exit 1
          fi

          terraform -chdir="$directory" init -input=false
          backend_file="$directory/.terraform/terraform.tfstate"
          backend_type="local"
          if [[ -f "$backend_file" ]]; then
            backend_type="$(jq -r '.backend.type // "local"' "$backend_file")"
          fi
          if [[ "$backend_type" == "local" ]]; then
            echo "::error::No remote Terraform backend is configured for Azure."
            exit 1
          fi

          printf '%s' "$TF_PLAN_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt --output "$plan_file" "$encrypted_plan"
          terraform -chdir="$directory" apply -input=false -lock-timeout=5m "$plan_file"
          rm -f "$plan_file"

      - name: Report completion
        run: echo "Terraform operation completed successfully for Azure." >> "$GITHUB_STEP_SUMMARY"
